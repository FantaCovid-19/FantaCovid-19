name: WakaTime Stats

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

jobs:
  update-stats:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Update WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN  }}
