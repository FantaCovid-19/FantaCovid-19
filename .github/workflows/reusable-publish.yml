name: Publish Project

on:
  workflow_call:
    inputs:
      project-name:
        description: The name of the project to publish
        required: true
        type: string
      pnpm-version:
        description: The version of pnpm to use
        required: false
        default: "10"
        type: string
      node-version:
        description: The version of Node.js to use
        required: false
        default: 22
        type: number
      working-directory:
        description: The working directory for the publish command
        required: true
        default: .
        type: string
      build:
        description: Whether to run the build command before publishing
        required: false
        default: false
        type: boolean
      skip-version-bump:
        description: Whether to skip version bumping and git tagging
        required: false
        default: false
        type: boolean
    secrets:
      GH_TOKEN:
        description: GitHub token with permissions to push to the repository
        required: true
      NPM_TOKEN:
        description: NPM token with permissions to publish packages
        required: true

jobs:
  publish:
    name: Publish ${{ inputs.project-name }}
    runs-on: ubuntu-latest

    if: github.repository_owner == 'fantacovid-19'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git remote set-url origin "https://${GITHUB_TOKEN}:x-oauth-basic@github.com/${GITHUB_REPOSITORY}.git"
          git config --local user.email "${GITHUB_EMAIL}"
          git config --local user.name "${GITHUB_USER}"
        env:
          GITHUB_USER: github-actions[bot]
          GITHUB_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN  }}

      - name: Build project
        if: inputs.build
        run: pnpm build

      - name: Bump Version & Publish
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{inputs.skip-version-bump}}" = "true" ]; then
            pnpm run bump --skip-automatic-bump
          else
            pnpm run bump
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --filter ${{ inputs.project-name }} --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
